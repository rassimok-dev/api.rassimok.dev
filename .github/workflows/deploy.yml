name: deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

env:
  REGION: europe-west4      # Netherlands; Warsaw forbids Cloud Run domain mappings
  SERVICE: api
  REPOSITORY: containers

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Keyless auth. No service-account JSON stored in GitHub secrets,
      # which is the single most common way cloud credentials leak.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # verify, not package: the native integration tests run against the
      # binary (with a Dev Services database) before any image is pushed.
      - name: Build and test native executable
        run: ./mvnw -B verify -Dnative

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f src/main/docker/Dockerfile.native-micro -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account api-runtime@rassimok-dev.iam.gserviceaccount.com \
            --set-secrets KLAD_DB_URL=klad-db-url:latest,RESEND_SMTP_KEY=resend-smtp-key:latest \
            --max-instances 3 \
            --min-instances 0 \
            --memory 256Mi \
            --cpu 1 \
            --port 8080 \
            --quiet

      # Readiness must show the database answering, and the site's /klad/api
      # proxy must reach this service. The body is checked as well because
      # Pages answers unknown paths with the home page and a 200.
      # Retries cover cold starts.
      - name: Smoke test
        run: |
          check() {
            for attempt in 1 2 3 4 5; do
              status=$(curl -s -o smoke-body.txt -w '%{http_code}' --max-time 30 "$1" || true)
              echo "$1 -> HTTP $status (attempt $attempt)"
              if [ "$status" = "200" ] && grep -Eq "$2" smoke-body.txt; then
                return 0
              fi
              sleep 10
            done
            echo "$1 did not answer 200 with a body matching $2"
            return 1
          }
          check https://api.rassimok.dev/q/health/ready '"<default>": *"UP"'
          check https://rassimok.dev/klad/api/status '"service": *"api.rassimok.dev"'
