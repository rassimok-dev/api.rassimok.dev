name: deploy

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: a read-only token everywhere. Only the deploy job, which
# runs on main and never on a pull request, may mint an OIDC token.
permissions:
  contents: read

env:
  REGION: europe-west4      # Netherlands; Warsaw forbids Cloud Run domain mappings
  SERVICE: api
  REPOSITORY: containers

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs, not tags: a tag can be moved
      # to new code after review, a SHA cannot. That matters most here,
      # because the deploy job holds cloud credentials. Dependabot bumps the
      # SHA and the version comment together (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation
    # One deploy at a time, and never cancel one halfway through.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Keyless auth. No service-account JSON stored in GitHub secrets,
      # which is the single most common way cloud credentials leak.
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build native executable
        run: ./mvnw -B package -Dnative -DskipTests

      # Secrets reach the script as environment variables, never spliced
      # into its text with ${{ }}, so no value can change what the shell runs.
      - name: Build and push image
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f src/main/docker/Dockerfile.native-micro -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --max-instances 3 \
            --min-instances 0 \
            --memory 256Mi \
            --cpu 1 \
            --port 8080 \
            --quiet
