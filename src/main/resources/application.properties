quarkus.application.name=api
quarkus.application.version=1.0.0-SNAPSHOT

# Cloud Run injects the port to listen on; 8080 is its default and our
# fallback for local runs.
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# Structured logs: Cloud Logging parses JSON, so this gives real fields
# to filter on instead of a wall of text.
%prod.quarkus.log.console.json=true

# --- Response headers -------------------------------------------------
# On every response, errors and /q/health included. Pages does not apply
# the site's _headers to what its proxy function returns, so the API sets
# them itself. No CORS: the game calls the API through the same origin.
quarkus.http.header."Cache-Control".value=no-store
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Content-Security-Policy".value=default-src 'none'; frame-ancestors 'none'

# --- Native image -----------------------------------------------------
# Build inside a container so no local GraalVM install is needed, and pin
# the builder explicitly. Mandrel tracks the JDK, and jdk-25 is the newest
# available: there is no Mandrel for JDK 26 or 27, which is what caps this
# project at Java 25. (25 is also the current LTS, so nothing is lost.)
quarkus.native.container-build=true
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

# --- Database ---------------------------------------------------------
# PostgreSQL 18. Dev and test get a throwaway container from Dev Services.
# Prod reads one JDBC URL (user, password and sslmode included) from the
# klad-db-url secret, so no username or password properties are set. The
# service does not start without the database: Flyway migrates at start.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18
# The fallback host never resolves. Without it a missing KLAD_DB_URL would
# quietly deactivate the datasource: the service would start, skip Flyway
# and still report ready.
%prod.quarkus.datasource.jdbc.url=${KLAD_DB_URL:jdbc:postgresql://klad-db-url-not-set.invalid/klad}
quarkus.flyway.migrate-at-start=true
# Flyway owns the schema; Hibernate never creates or alters tables.
quarkus.hibernate-orm.schema-management.strategy=none
