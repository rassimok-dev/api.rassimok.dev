quarkus.application.name=api
quarkus.application.version=1.0.0-SNAPSHOT

# Cloud Run injects the port to listen on; 8080 is its default and our
# fallback for local runs.
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# Structured logs: Cloud Logging parses JSON, so this gives real fields
# to filter on instead of a wall of text.
%prod.quarkus.log.console.json=true

# --- Native image -----------------------------------------------------
# Build inside a container so no local GraalVM install is needed, and pin
# the builder explicitly. Mandrel tracks the JDK, and jdk-25 is the newest
# available: there is no Mandrel for JDK 26 or 27, which is what caps this
# project at Java 25. (25 is also the current LTS, so nothing is lost.)
quarkus.native.container-build=true
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

# --- Database ---------------------------------------------------------
# PostgreSQL 18 is the pinned target when a datasource is added. It is
# deliberately NOT wired up yet: this service stores nothing, and an
# unused datasource would fail at startup in prod with no database to
# reach. Uncomment alongside the jdbc-postgresql extension.
# quarkus.datasource.db-kind=postgresql
# quarkus.datasource.devservices.image-name=postgres:18
