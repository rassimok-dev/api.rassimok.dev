quarkus.application.name=api
quarkus.application.version=1.0.0-SNAPSHOT

# Cloud Run injects the port to listen on; 8080 is its default and our
# fallback for local runs.
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0
# Real bodies are under 200 bytes. The 10 MB default would let a few
# anonymous requests fill an instance's memory with JSON trees.
quarkus.http.limits.max-body-size=4K

# Structured logs: Cloud Logging parses JSON, so this gives real fields
# to filter on instead of a wall of text.
%prod.quarkus.log.console.json=true

# --- Response headers -------------------------------------------------
# On every response, errors and /q/health included. Pages does not apply
# the site's _headers to what its proxy function returns, so the API sets
# them itself. No CORS: the game calls the API through the same origin.
quarkus.http.header."Cache-Control".value=no-store
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Content-Security-Policy".value=default-src 'none'; frame-ancestors 'none'

# --- WebSockets -------------------------------------------------------
# WebSockets are not covered by CORS, so the handshake check accepts only
# this exact Origin. A text message over 512 bytes is refused by the
# endpoint with close code 1008. These limits only cap the memory a socket
# can take; a frame over them drops the connection without a close code.
# Compression is off (WebSocketCompressionOff, there is no key for it): it
# would apply the limits to compressed bytes, and a small frame could
# inflate to megabytes before being refused.
klad.websocket.allowed-origin=https://rassimok.dev
quarkus.http.websocket-server.max-frame-size=4096
quarkus.http.websocket-server.max-message-size=4096

# --- Native image -----------------------------------------------------
# Build inside a container so no local GraalVM install is needed, and pin
# the builder explicitly. Mandrel tracks the JDK, and jdk-25 is the newest
# available: there is no Mandrel for JDK 26 or 27, which is what caps this
# project at Java 25. (25 is also the current LTS, so nothing is lost.)
quarkus.native.container-build=true
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

# --- Database ---------------------------------------------------------
# PostgreSQL 18. Dev and test get a throwaway container from Dev Services.
# Prod reads one JDBC URL (user, password and sslmode included) from the
# klad-db-url secret, so no username or password properties are set. The
# service does not start without the database: Flyway migrates at start.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18
# The fallback host never resolves. Without it a missing KLAD_DB_URL would
# quietly deactivate the datasource: the service would start, skip Flyway
# and still report ready.
%prod.quarkus.datasource.jdbc.url=${KLAD_DB_URL:jdbc:postgresql://klad-db-url-not-set.invalid/klad}
quarkus.flyway.migrate-at-start=true
# Flyway owns the schema; Hibernate never creates or alters tables.
quarkus.hibernate-orm.schema-management.strategy=none
# Neon suspends after 5 idle minutes, so a pooled connection may be dead.
# Check one idle for over a minute when it is taken from the pool; the
# background checks cannot be relied on while Cloud Run throttles the CPU.
quarkus.datasource.jdbc.foreground-validation-interval=1M

# --- Mail ---------------------------------------------------------------
# Login codes go out through Resend's SMTP relay. Port 465 speaks TLS from
# the first byte; STARTTLS on 587 would open in plain text first. The key
# comes from the resend-smtp-key secret. Dev and test keep every mail in a
# mock mailbox; never enable the mock without a profile, or production
# would send nothing.
quarkus.mailer.from=КЛАД <klad@mail.rassimok.dev>
quarkus.mailer.host=smtp.resend.com
quarkus.mailer.port=465
quarkus.mailer.tls=true
quarkus.mailer.username=resend
%prod.quarkus.mailer.password=${RESEND_SMTP_KEY:}
# Without a key a send then fails before any address is sent, instead of
# trying the mail without logging in.
quarkus.mailer.login=REQUIRED
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true
